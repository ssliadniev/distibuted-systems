services:
  mongo1:
    image: mongo:8.0
    command: ["--replSet", "myReplicaSet", "--bind_ip_all"]
    ports:
      - "27017:27017"

  mongo2:
    image: mongo:8.0
    command: ["--replSet", "myReplicaSet", "--bind_ip_all"]
    ports:
      - "27018:27017"

  mongo3:
    image: mongo:8.0
    command: ["--replSet", "myReplicaSet", "--bind_ip_all"]
    ports:
      - "27019:27017"

  mongo-init:
    image: mongo:8.0
    depends_on:
      - mongo1
      - mongo2
      - mongo3
    command: >
      bash -c "
        sleep 5 &&
        mongosh --host mongo1:27017 --eval '
          rs.initiate({
            _id: \"myReplicaSet\",
            members: [
              { _id: 0, host: \"mongo1:27017\", priority: 2 },
              { _id: 1, host: \"mongo2:27017\", priority: 1 },
              { _id: 2, host: \"mongo3:27017\", priority: 1 }
            ]
          });
        '
      "

  app:
    build: .
    profiles:
      - client
